name: Update Forex Data

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows you to run it manually by clicking a button

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Scraper Repo
        run: git clone https://github.com/ehsanrs2/forexfactory-scraper.git scraper-code

      - name: Install dependencies
        run: |
          cd scraper-code
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          cd scraper-code
          python -m src.forexfactory.main --csv ../forex_factory_cache.csv --tz UTC --impact high,medium --keep-currencies USD

      - name: Commit and push CSV
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add forex_factory_cache.csv
          git commit -m "Automated CSV Update" || echo "No changes to commit"
          git push
