name: Update Forex Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Scraper Repo
        run: git clone https://github.com/ehsanrs2/forexfactory-scraper.git scraper-code

      - name: Install dependencies
        run: |
          cd scraper-code
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          cd scraper-code
          START_DATE=$(date -d "120 days ago" +%Y-%m-%d)
          END_DATE=$(date +%Y-%m-%d)
          python -m src.forexfactory.main --start $START_DATE --end $END_DATE --csv ../forex_factory_cache.csv --tz UTC --impact high,medium --keep-currencies USD

      - name: Commit and push CSV
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add forex_factory_cache.csv
          git commit -m "Automated CSV Update" || echo "No changes to commit"
          git push
